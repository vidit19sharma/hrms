name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "server/**"
  pull_request:
    paths:
      - "server/**"

jobs:
  backend-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          cd server
          pip install -r requirements.txt

      - name: Verify FastAPI app loads
        run: |
          cd server
          python -c "from app.main import app; print('FastAPI app loaded successfully')"
